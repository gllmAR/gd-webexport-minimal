<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentation — gd-webexport-minimal</title>
  <link rel="stylesheet" href="https://unpkg.com/docsify/lib/themes/vue.css" />
</head>
<body>
  <div id="app"># Documentation

Bienvenue dans la documentation du projet.</div>

  <script>
    window.$docsify = {
      name: 'gd-webexport-minimal',
      loadSidebar: false,
      subMaxLevel: 2,
      mermaidConfig: {
        // selector used by docsify-mermaid to find mermaid blocks
        querySelector: '.mermaid'
      }
    }
  </script>

  <!-- Use mermaid-docsify plugin: import ESM mermaid, set window.mermaid, then load the plugin -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    // expose for the docsify plugin
    window.mermaid = mermaid;
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

  <script src="https://unpkg.com/docsify/lib/docsify.min.js"></script>
</body>
</html>
